name: Release

# Pushing a tag such as v0.1.0 publishes that version: archives for Linux,
# macOS and Windows with their checksums on the releases page, and a
# container image at ghcr.io. A tag with a suffix, such as v0.2.0-rc1, is
# published as a pre-release and does not become "latest".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build the archives
        run: scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: Write the Homebrew formula
        run: scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist > dist/moonwalk.rb
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes "${flags[@]}"
      - name: Publish the container image
        env:
          TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          version=${GITHUB_REF_NAME#v}
          tags=(--tag "$image:$version")
          case "$version" in *-*) ;; *) tags+=(--tag "$image:latest") ;; esac
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg "VERSION=$version" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            "${tags[@]}" --push .
      - name: Update the Homebrew tap
        # Only where a tap exists and a token for it has been stored: a
        # repository named homebrew-tap next to this one, and the secret
        # HOMEBREW_TAP_TOKEN with write access to it.
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "No HOMEBREW_TAP_TOKEN; the formula is attached to the release instead."
            exit 0
          fi
          case "$GITHUB_REF_NAME" in *-*) echo "A pre-release does not go to the tap."; exit 0 ;; esac
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/moonwalk.rb tap/Formula/moonwalk.rb
          cd tap
          git add Formula/moonwalk.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "moonwalk ${GITHUB_REF_NAME#v}"
          git push
